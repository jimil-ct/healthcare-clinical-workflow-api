name: Demo Security Gate

on:
  pull_request:
  push:

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo policy check
        run: |
          # Validate critical files exist
          if [ ! -f "clinical-validation.config" ]; then
            echo "Error: Clinical validation configuration missing"
            exit 1
          fi
          echo "CognitivTrust demo policy check passed"
